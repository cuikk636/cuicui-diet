<!doctyp html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f2">
<title>崔崔的减肥打卡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff7f2;color:#332b28;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
.app{max-width:520px;margin:auto;padding:22px 18px 40px}
h1{font-size:28px;margin:8px 0 4px}.date{color:#8b7d76;font-size:14px;margin-bottom:18px}
.card{background:white;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 5px 18px rgba(80,50,40,.07)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff3ed;border-radius:16px;padding:14px}.label{font-size:13px;color:#8b7d76}.value{font-size:23px;font-weight:700;margin-top:5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #f1e8e4}.row:last-child{border-bottom:0}
button{border:0;border-radius:13px;padding:10px 14px;background:#f1ebe8;color:#4b403b;font-weight:600}button.done{background:#332b28;color:white}
input,textarea{width:100%;border:1px solid #eaded8;border-radius:13px;padding:12px;background:#fff;font-size:16px;margin-top:7px;outline:none}
.primary{width:100%;background:#332b28;color:white;font-size:16px;padding:14px;margin-top:8px}
.progress{height:10px;background:#eee5e0;border-radius:99px;overflow:hidden;margin-top:9px}.bar{height:100%;background:#332b28;width:0}
.small{font-size:12px;color:#968982;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<h1>🌷 崔崔的减肥打卡</h1>
<div class="date" id="date"></div>

<div class="card">
  <div class="stats">
    <div class="stat"><div class="label">⚖️ 今日体重</div><div class="value" id="weightShow">-- kg</div></div>
    <div class="stat"><div class="label">🎯 目标体重</div><div class="value" id="goalShow">55 kg</div></div>
  </div>
  <div class="small" id="lossText">填写体重后，这里会显示距离目标还有多少。</div>
</div>

<div class="card">
<h2>📅 今日打卡</h2>
<div class="row"><span>💧 喝水</span><button data-key="water">打卡</button></div>
<div class="row"><span>🏃 运动</span><button data-key="exercise">打卡</button></div>
<div class="row"><span>🍚 饮食</span><button data-key="food">打卡</button></div>
<div class="row"><span>🥤 零奶茶 / 咖啡</span><button data-key="drink">打卡</button></div>
<button class="primary" id="complete">完成今日打卡</button>
</div>

<div class="card">
<h2>🔥 连续打卡</h2>
<div class="value" id="streak">0 天</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="small">每天完成全部 4 项习惯即可连续打卡。</div>
</div>

<div class="card">
<h2>⚖️ 记录体重</h2>
<input id="weight" type="number" step="0.1" placeholder="例如 65.2">
<label class="small">目标体重（kg）</label>
<input id="goal" type="number" step="0.1" placeholder="例如 55">
<button class="primary" id="saveWeight">保存</button>
</div>

<div class="card">
<h2>📝 今日备注</h2>
<textarea id="note" rows="4" placeholder="今天感觉怎么样？"></textarea>
<button class="primary" id="saveNote">保存备注</button>
</div>
</div>

<script>
const KEY="cuicui_fitness_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"goal":55,"days":{}}');
const today=new Date().toISOString().slice(0,10);
if(!db.days[today]) db.days[today]={water:false,exercise:false,food:false,drink:false,weight:"",note:""};
const d=db.days[today];

document.getElementById("date").textContent=new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
document.getElementById("goal").value=db.goal;
document.getElementById("weight").value=d.weight||"";
document.getElementById("note").value=d.note||"";

function save(){localStorage.setItem(KEY,JSON.stringify(db)); render();}
function render(){
 document.getElementById("goalShow").textContent=(db.goal||"--")+" kg";
 document.getElementById("weightShow").textContent=d.weight?d.weight+" kg":"-- kg";
 document.getElementById("lossText").textContent=d.weight&&db.goal ? (d.weight-db.goal>0?"距离目标还有 "+(d.weight-db.goal).toFixed(1)+" kg":"已达到或低于目标体重 🎉") : "填写体重后，这里会显示距离目标还有多少。";
 document.querySelectorAll("[data-key]").forEach(b=>{let k=b.dataset.key;b.classList.toggle("done",!!d[k]);b.textContent=d[k]?"已完成 ✓":"打卡";});
 let complete=Object.keys({water:1,exercise:1,food:1,drink:1}).every(k=>d[k]);
 document.getElementById("complete").textContent=complete?"🎉 今日已完成":"完成今日打卡";
 let count=0,cur=new Date();
 while(true){let k=cur.toISOString().slice(0,10),x=db.days[k];if(!x||!["water","exercise","food","drink"].every(z=>x[z]))break;count++;cur.setDate(cur.getDate()-1);}
 document.getElementById("streak").textContent=count+" 天";
 document.getElementById("bar").style.width=Math.min(count%7/7*100,100)+"%";
}
document.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>{d[b.dataset.key]=!d[b.dataset.key];save()});
document.getElementById("saveWeight").onclick=()=>{d.weight=document.getElementById("weight").value;db.goal=document.getElementById("goal").value||55;save();alert("体重已保存");};
document.getElementById("saveNote").onclick=()=>{d.note=document.getElementById("note").value;save();alert("备注已保存");};
document.getElementById("complete").onclick=()=>{["water","exercise","food","drink"].forEach(k=>d[k]=true);save();};
render();
</script>
</body>
</html>
