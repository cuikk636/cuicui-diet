<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>崔崔的减肥打卡</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;background:#f5f7fb;color:#222}
.wrap{max-width:680px;margin:auto;padding:24px 16px 40px}
h1{text-align:center;margin:8px 0 6px}.sub{text-align:center;color:#777;margin-bottom:20px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #0000000d}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:14px;color:#666;margin-bottom:6px}
input,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}
textarea{min-height:90px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:17px}
.check input{width:22px;height:22px}
button{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600;background:#222;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stat b{display:block;font-size:25px;margin-top:5px}.small{font-size:13px;color:#888}
</style>
</head>
<body>
<div class="wrap">
<h1>🌷 崔崔的减肥打卡</h1>
<div class="sub">每天一点点，坚持就是胜利</div>

<div class="card">
<div class="grid">
<div><label>今日体重（kg）</label><input id="weight" type="number" step="0.1" placeholder="例如 60.5"></div>
<div><label>目标体重（kg）</label><input id="goal" type="number" step="0.1" placeholder="例如 55"></div>
</div>
</div>

<div class="card">
<h3>📋 今日打卡</h3>
<label class="check"><input id="water" type="checkbox"> 💧 喝够水</label>
<label class="check"><input id="exercise" type="checkbox"> 🏃 完成运动</label>
<label class="check"><input id="diet" type="checkbox"> 🥗 控制饮食</label>
<label class="check"><input id="noTea" type="checkbox"> 🥤 零奶茶 / 咖啡</label>
</div>

<div class="card">
<h3>📝 今日备注</h3>
<textarea id="note" placeholder="写下今天的状态、心情或饮食情况……"></textarea>
</div>

<div class="card stats">
<div><span class="small">连续打卡</span><b id="streak">0</b><span class="small">天</span></div>
<div><span class="small">今日完成</span><b id="done">0/4</b></div>
<div><span class="small">体重变化</span><b id="change">--</b></div>
</div>

<button onclick="save()">💾 保存今日打卡</button>
<div class="small" style="text-align:center;margin-top:14px">数据保存在你的手机浏览器中</div>
</div>

<script>
const ids=["weight","goal","water","exercise","diet","noTea","note"];
const key="cuicuiDietRecords";
function records(){return JSON.parse(localStorage.getItem(key)||"[]")}
function load(){
 const r=records(), t=new Date().toISOString().slice(0,10), x=r.find(a=>a.date===t);
 if(x){ids.forEach(id=>{const e=document.getElementById(id); if(e.type==="checkbox")e.checked=!!x[id]; else e.value=x[id]??""})}
 update();
}
function save(){
 const r=records(), t=new Date().toISOString().slice(0,10);
 const x={date:t}; ids.forEach(id=>{const e=document.getElementById(id);x[id]=e.type==="checkbox"?e.checked:e.value});
 const i=r.findIndex(a=>a.date===t); if(i>=0)r[i]=x; else r.push(x);
 r.sort((a,b)=>a.date.localeCompare(b.date)); localStorage.setItem(key,JSON.stringify(r)); update(); alert("今日打卡已保存 ❤️");
}
function update(){
 const r=records(), t=new Date().toISOString().slice(0,10), x=r.find(a=>a.date===t);
 const done=x?["water","exercise","diet","noTea"].filter(k=>x[k]).length:0;
 document.getElementById("done").textContent=done+"/4";
 let streak=0,d=new Date();
 while(true){const s=d.toISOString().slice(0,10);if(r.some(a=>a.date===s)){streak++;d.setDate(d.getDate()-1)}else break}
 document.getElementById("streak").textContent=streak;
 const ws=r.filter(a=>a.weight!==""&&a.weight!=null).map(a=>Number(a.weight)).filter(Number.isFinite);
 document.getElementById("change").textContent=ws.length>1?((ws[ws.length-1]-ws[0]).toFixed(1)+" kg"):"--";
}
load();
</script>
</body>
</html>
