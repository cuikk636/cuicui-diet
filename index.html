<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffdce9">
<title>🌷 崔崔的减肥打卡</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  padding:20px 16px 90px;
  background:#f5f7fb;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Helvetica Neue",Arial,sans-serif
}
.app{max-width:760px;margin:auto}
.card,.hero{
  background:#fff;
  border:2px solid #f3bfd2;
  border-radius:25px;
  box-shadow:0 7px 22px #d9c9d818;
}
.hero{
  padding:22px 18px;
  background:linear-gradient(135deg,#fff,#ffeaf2);
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:52px;height:52px;border-radius:50%;
  display:grid;place-items:center;
  background:#fff;border:2px solid #f2a8c3;
  font-size:30px
}
h1{margin:0;font-size:26px;color:#7b2949}
.sub{margin:5px 0 0;color:#a16c7e;font-size:15px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px
}
.field{
  background:#fff;border:1px solid #efc9d8;
  border-radius:15px;padding:11px
}
.field label{display:block;font-size:13px;color:#936c7b}
.field input{
  width:100%;border:0;outline:0;
  font-size:20px;color:#642d46;
  margin-top:5px;background:transparent
}
.card{padding:18px;margin-top:14px}
.card h2{font-size:20px;margin:0 0 12px}
.pill{
  float:right;font-size:13px;
  background:#fff0f5;padding:6px 10px;
  border-radius:99px;color:#a23b61
}
.task{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px dashed #f0ceda
}
.task:last-child{border:0}
.check{
  width:36px;height:36px;
  border:2px solid #e3a8bf;
  border-radius:11px;
  display:grid;place-items:center;
  color:transparent;flex:none;
  background:#fff
}
.task.done .check{
  background:#ef7da7;
  border-color:#ef7da7;
  color:white
}
.task.done b{text-decoration:line-through;opacity:.55}
.task b{font-size:17px}
.progress{
  height:14px;background:#f9e2eb;
  border-radius:99px;overflow:hidden
}
.progress div{
  height:100%;width:0;
  background:linear-gradient(90deg,#ef8eae,#d95c87);
  transition:.3s
}
.percent{text-align:center;font-size:28px;font-weight:800;color:#a23b61;margin:8px}

textarea{
  width:100%;min-height:110px;
  border:1px solid #e8ccd8;
  border-radius:12px;
  padding:12px;font-size:16px;
  outline:0;resize:vertical
}
button{
  width:100%;border:0;
  border-radius:16px;
  padding:16px;
  font-size:18px;font-weight:700;
  cursor:pointer
}
.save{background:#222;color:white;margin-top:14px}
.clear{background:#fff;border:1px solid #e0ccd5;color:#9b687c;margin-top:10px}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;text-align:center
}
.stat{
  padding:12px 5px;
  background:#fff7fa;
  border-radius:15px
}
.stat span{display:block;color:#a16c7e;font-size:13px}
.stat strong{font-size:25px;color:#222}

.history-item{
  padding:12px 0;
  border-bottom:1px dashed #ead2dc
}
.history-item:last-child{border:0}
.history-date{font-weight:700}
.history-detail{color:#777;margin-top:4px;font-size:14px}

.tip{
  text-align:center;color:#a16c7e;
  font-size:13px;margin-top:12px
}

@media(max-width:500px){
  .grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="app">

<section class="hero">
  <div class="brand">
    <div class="logo">🌷</div>
    <div>
      <h1>崔崔的减肥打卡</h1>
      <div class="sub">每天一点点，坚持就是胜利</div>
    </div>
  </div>

  <div class="grid">
    <div class="field">
      <label>今天体重（kg）</label>
      <input id="weight" type="number" step="0.1" placeholder="例如 60.5">
    </div>

    <div class="field">
      <label>目标体重（kg）</label>
      <input id="target" type="number" step="0.1" placeholder="例如 55">
    </div>
  </div>
</section>

<section class="card">
  <h2>📋 今日打卡 <span class="pill" id="count">0/4</span></h2>

  <div class="task" data-id="water">
    <div class="check">✓</div>
    <b>💧 喝够水</b>
  </div>

  <div class="task" data-id="sport">
    <div class="check">✓</div>
    <b>🏃 完成运动</b>
  </div>

  <div class="task" data-id="food">
    <div class="check">✓</div>
    <b>🥗 控制饮食</b>
  </div>

  <div class="task" data-id="drink">
    <div class="check">✓</div>
    <b>🥤 零奶茶 / 咖啡</b>
  </div>
</section>

<section class="card">
  <h2>📈 今日完成度</h2>
  <div class="percent" id="percent">0%</div>
  <div class="progress">
    <div id="progress"></div>
  </div>
</section>

<section class="card">
  <h2>📝 今日备注</h2>
  <textarea id="note" placeholder="今天感觉怎么样？想吃什么？运动了多久？"></textarea>
</section>

<section class="card">
  <h2>📊 我的进度</h2>

  <div class="stats">
    <div class="stat">
      <span>连续打卡</span>
      <strong id="streak">0</strong>
    </div>

    <div class="stat">
      <span>今日完成</span>
      <strong id="todayDone">0/4</strong>
    </div>

    <div class="stat">
      <span>体重变化</span>
      <strong id="change">--</strong>
    </div>
  </div>
</section>

<button class="save" onclick="saveToday()">💾 保存今日打卡</button>

<div class="tip">数据保存在你自己的手机浏览器中</div>

<section class="card">
  <h2>📅 历史打卡</h2>
  <div id="history"></div>
  <button class="clear" onclick="clearHistory()">清空历史记录</button>
</section>

</div>

<script>
const KEY="cuicuiDietData";

let data=JSON.parse(localStorage.getItem(KEY)||"{}");

function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

function getTasks(){
  const result={};
  document.querySelectorAll(".task").forEach(el=>{
    result[el.dataset.id]=el.classList.contains("done");
  });
  return result;
}

function update(){
  const tasks=getTasks();
  const done=Object.values(tasks).filter(Boolean).length;
  const percent=Math.round(done/4*100);

  document.getElementById("count").textContent=done+"/4";
  document.getElementById("todayDone").textContent=done+"/4";
  document.getElementById("percent").textContent=percent+"%";
  document.getElementById("progress").style.width=percent+"%";

  let change="--";
  const history=Object.values(data)
    .filter(x=>x.weight)
    .sort((a,b)=>a.date.localeCompare(b.date));

  if(history.length>=2){
    const first=Number(history[0].weight);
    const last=Number(history[history.length-1].weight);
    const diff=(last-first).toFixed(1);
    change=(diff>0?"+":"")+diff;
  }

  document.getElementById("change").textContent=change;
}

document.querySelectorAll(".task").forEach(task=>{
  task.addEventListener("click",()=>{
    task.classList.toggle("done");
    update();
  });
});

function saveToday(){
  const date=today();

  data[date]={
    date,
    weight:document.getElementById("weight").value,
    target:document.getElementById("target").value,
    tasks:getTasks(),
    note:document.getElementById("note").value
  };

  localStorage.setItem(KEY,JSON.stringify(data));
  renderHistory();
  update();

  alert("🌷 今日打卡保存成功！");
}

function loadToday(){
  const item=data[today()];
  if(!item)return;

  document.getElementById("weight").value=item.weight||"";
  document.getElementById("target").value=item.target||"";
  document.getElementById("note").value=item.note||"";

  document.querySelectorAll(".task").forEach(el=>{
    if(item.tasks && item.tasks[el.dataset.id]){
      el.classList.add("done");
    }
  });
}

function renderHistory(){
  const box=document.getElementById("history");
  const list=Object.values(data).sort((a,b)=>b.date.localeCompare(a.date));

  if(!list.length){
    box.innerHTML='<div style="color:#999">还没有历史记录</div>';
    return;
  }

  box.innerHTML=list.map(item=>{
    const done=item.tasks?
      Object.values(item.tasks).filter(Boolean).length:0;

    return `
      <div class="history-item">
        <div class="history-date">📅 ${item.date}</div>
        <div class="history-detail">
          ⚖️ ${item.weight||"--"} kg　
          🎯 ${item.target||"--"} kg　
          ✅ ${done}/4
        </div>
        ${item.note?`<div class="history-detail">📝 ${item.note}</div>`:""}
      </div>
    `;
  }).join("");

  calculateStreak(list);
}

function calculateStreak(list){
  if(!list.length){
    document.getElementById("streak").textContent="0";
    return;
  }

  const dates=list.map(x=>x.date).sort().reverse();
  let streak=0;
  let expected=new Date();

  for(const date of dates){
    const d=new Date(date+"T00:00:00");

    const e=new Date(expected);
    e.setHours(0,0,0,0);

    if(d.getTime()===e.getTime()){
      streak++;
      expected.setDate(expected.getDate()-1);
    }else if(streak===0){
      continue;
    }else{
      break;
    }
  }

  document.getElementById("streak").textContent=streak;
}

function clearHistory(){
  if(confirm("确定要清空所有历史记录吗？")){
    localStorage.removeItem(KEY);
    data={};
    location.reload();
  }
}

loadToday();
renderHistory();
update();
</script>

</body>
</html>
