<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffdce9">
<title>🌷 崔崔的减肥打卡</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  padding:20px 16px 100px;
  background:#f5f7fb;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,
  "Helvetica Neue",Arial,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
}

.hero,.card{
  background:#fff;
  border:2px solid #f3bfd2;
  border-radius:25px;
  box-shadow:0 7px 22px #d9c9d818;
  margin-bottom:18px;
}

.hero{
  padding:25px 20px;
  text-align:center;
  background:linear-gradient(135deg,#fff,#fff6fa);
}

.hero h1{
  margin:0 0 8px;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#9b6d7e;
  font-size:15px;
}

.progress{
  height:14px;
  background:#f4e5eb;
  border-radius:20px;
  margin-top:20px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#e99ab7,#c97898);
  border-radius:20px;
  transition:.3s;
}

.percent{
  margin-top:8px;
  color:#b17b8d;
  font-weight:bold;
}

.card{
  padding:22px 18px;
}

.title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:24px;
  font-weight:800;
  margin-bottom:18px;
}

textarea{
  width:100%;
  min-height:150px;
  resize:none;
  border:2px solid #ead1dc;
  border-radius:20px;
  padding:18px;
  font-size:17px;
  outline:none;
  color:#333;
  background:#fff;
}

textarea:focus,
input:focus{
  border-color:#d995ae;
}

textarea::placeholder{
  color:#b8b8b8;
}

.tasks{
  display:grid;
  gap:12px;
}

.task{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px;
  border-radius:18px;
  background:#fff7fa;
  border:1px solid #f0dce4;
  cursor:pointer;
}

.task.done{
  background:#f7e5ec;
}

.check{
  width:28px;
  height:28px;
  border:2px solid #d59aae;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:bold;
}

.task.done .check{
  background:#c9859f;
}

.task-text{
  font-size:17px;
  flex:1;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#fff7fa;
  border-radius:20px;
  padding:18px 8px;
  text-align:center;
}

.stat-label{
  color:#9e7180;
  font-size:15px;
  margin-bottom:8px;
}

.stat-value{
  font-size:27px;
  font-weight:800;
}

.weight-box{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;
  padding:15px;
  border:2px solid #ead1dc;
  border-radius:15px;
  font-size:17px;
  outline:none;
}

button{
  border:0;
  border-radius:15px;
  padding:15px 20px;
  font-size:16px;
  font-weight:bold;
  background:#d78fa9;
  color:white;
}

button:active{
  transform:scale(.97);
}

.save{
  width:100%;
  margin-top:15px;
  background:#222;
  font-size:20px;
  padding:18px;
}

.history-item{
  padding:15px;
  margin-bottom:10px;
  border-radius:16px;
  background:#fff7fa;
  border:1px solid #f0dce4;
}

.history-date{
  font-weight:bold;
  color:#875c6c;
}

.history-detail{
  margin-top:5px;
  color:#777;
  font-size:14px;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:15px;
}

.small{
  color:#9d7180;
  text-align:center;
  font-size:13px;
  margin-top:10px;
}

@media(max-width:500px){
  body{
    padding-left:12px;
    padding-right:12px;
  }

  .stats{
    gap:8px;
  }

  .stat{
    padding:15px 5px;
  }

  .stat-value{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section class="hero">
    <h1>🌷 崔崔的减肥打卡</h1>
    <p>每天进步一点点，坚持就是胜利</p>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="percent" id="percent">0%</div>
  </section>


  <section class="card">
    <div class="title">📝 今日备注</div>

    <textarea id="note"
      placeholder="今天感觉怎么样？想吃什么？运动了多久？"></textarea>
  </section>


  <section class="card">
    <div class="title">🎯 今日任务</div>

    <div class="tasks">

      <div class="task" data-index="0">
        <div class="check"></div>
        <div class="task-text">💧 今天喝够水</div>
      </div>

      <div class="task" data-index="1">
        <div class="check"></div>
        <div class="task-text">🥗 今天控制饮食</div>
      </div>

      <div class="task" data-index="2">
        <div class="check"></div>
        <div class="task-text">🏃 今天完成运动</div>
      </div>

      <div class="task" data-index="3">
        <div class="check"></div>
        <div class="task-text">🌙 今天按时休息</div>
      </div>

    </div>
  </section>


  <section class="card">
    <div class="title">📊 我的进度</div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">连续打卡</div>
        <div class="stat-value" id="streak">0</div>
      </div>

      <div class="stat">
        <div class="stat-label">今日完成</div>
        <div class="stat-value" id="completed">0/4</div>
      </div>

      <div class="stat">
        <div class="stat-label">体重变化</div>
        <div class="stat-value" id="weightChange">--</div>
      </div>

    </div>
  </section>


  <section class="card">
    <div class="title">⚖️ 今日体重</div>

    <div class="weight-box">
      <input
        id="weight"
        type="number"
        step="0.1"
        inputmode="decimal"
        placeholder="例如 65.5 kg">
      <button onclick="saveWeight()">记录</button>
    </div>

    <div class="small">
      体重会保存在你的手机浏览器中
    </div>
  </section>


  <button class="save" onclick="saveToday()">
    💾 保存今日打卡
  </button>


  <section class="card">
    <div class="title">📅 历史打卡</div>

    <div id="history">
      <div class="empty">还没有历史记录</div>
    </div>
  </section>

</div>


<script>

const STORAGE_KEY = "cuicui_diet_data";

let data = JSON.parse(
  localStorage.getItem(STORAGE_KEY) || "{}"
);

if(!data.history){
  data.history = {};
}

if(!data.weights){
  data.weights = [];
}

let today = getToday();

if(!data.history[today]){
  data.history[today] = {
    tasks:[false,false,false,false],
    note:"",
    weight:null
  };
}

let todayData = data.history[today];


function getToday(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(d.getMonth()+1).padStart(2,"0");

  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}


function updateUI(){

  document.getElementById("note").value =
    todayData.note || "";

  document.getElementById("weight").value =
    todayData.weight || "";

  const tasks =
    document.querySelectorAll(".task");

  let completed = 0;

  tasks.forEach((task,i)=>{

    const check =
      task.querySelector(".check");

    if(todayData.tasks[i]){

      task.classList.add("done");

      check.textContent = "✓";

      completed++;

    }else{

      task.classList.remove("done");

      check.textContent = "";

    }

  });


  document.getElementById("completed").textContent =
    completed + "/4";


  const percent =
    Math.round(completed / 4 * 100);

  document.getElementById("percent").textContent =
    percent + "%";

  document.getElementById("progressBar").style.width =
    percent + "%";


  document.getElementById("streak").textContent =
    calculateStreak();


  updateWeightChange();

  renderHistory();
}


document.querySelectorAll(".task").forEach(task=>{

  task.addEventListener("click",()=>{

    const index =
      Number(task.dataset.index);

    todayData.tasks[index] =
      !todayData.tasks[index];

    saveData();

    updateUI();

  });

});


document.getElementById("note")
.addEventListener("input",(e)=>{

  todayData.note = e.target.value;

  saveData();

});


function saveWeight(){

  const value =
    parseFloat(
      document.getElementById("weight").value
    );

  if(isNaN(value) || value <= 0){

    alert("请输入正确的体重");

    return;
  }

  todayData.weight = value;

  const existing =
    data.weights.findIndex(
      x=>x.date===today
    );

  if(existing >= 0){

    data.weights[existing].weight =
      value;

  }else{

    data.weights.push({
      date:today,
      weight:value
    });

  }

  saveData();

  updateUI();

  alert("⚖️ 今日体重已记录");

}


function saveToday(){

  todayData.note =
    document.getElementById("note").value;

  const weight =
    parseFloat(
      document.getElementById("weight").value
    );

  if(!isNaN(weight) && weight > 0){

    todayData.weight = weight;

    const existing =
      data.weights.findIndex(
        x=>x.date===today
      );

    if(existing >= 0){

      data.weights[existing].weight =
        weight;

    }else{

      data.weights.push({
        date:today,
        weight:weight
      });

    }

  }

  saveData();

  updateUI();

  alert("🎉 今日打卡已保存！");

}


function saveData(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(data)
  );

}


function calculateStreak(){

  let streak = 0;

  let date = new Date();

  while(true){

    const key =
      formatDate(date);

    const record =
      data.history[key];

    if(!record){

      break;

    }

    const complete =
      record.tasks &&
      record.tasks.every(Boolean);

    if(!complete){

      break;

    }

    streak++;

    date.setDate(
      date.getDate()-1
    );

  }

  return streak;

}


function formatDate(date){

  const y =
    date.getFullYear();

  const m =
    String(date.getMonth()+1)
    .padStart(2,"0");

  const d =
    String(date.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${d}`;

}


function updateWeightChange(){

  const weights =
    [...data.weights]
    .sort((a,b)=>
      a.date.localeCompare(b.date)
    );

  const el =
    document.getElementById("weightChange");

  if(weights.length < 2){

    el.textContent = "--";

    return;

  }

  const first =
    weights[0].weight;

  const latest =
    weights[weights.length-1].weight;

  const diff =
    latest-first;

  if(diff > 0){

    el.textContent =
      "+" + diff.toFixed(1);

  }else{

    el.textContent =
      diff.toFixed(1);

  }

}


function renderHistory(){

  const box =
    document.getElementById("history");

  const records =
    Object.entries(data.history)
    .sort((a,b)=>
      b[0].localeCompare(a[0])
    );

  if(records.length===0){

    box.innerHTML =
      '<div class="empty">还没有历史记录</div>';

    return;

  }

  box.innerHTML = "";

  records.forEach(([date,record])=>{

    const count =
      record.tasks
      ? record.tasks.filter(Boolean).length
      : 0;

    const div =
      document.createElement("div");

    div.className =
      "history-item";

    div.innerHTML = `
      <div class="history-date">
        📅 ${date}
      </div>

      <div class="history-detail">
        完成 ${count}/4
        ${record.weight
          ? " · 体重 " + record.weight + " kg"
          : ""}
      </div>

      ${
        record.note
        ? `<div class="history-detail">
             📝 ${escapeHtml(record.note)}
           </div>`
        : ""
      }
    `;

    box.appendChild(div);

  });

}


function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


saveData();

updateUI();

</script>

</body>
</html>
