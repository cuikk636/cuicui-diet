<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🌷崔崔的减肥打卡</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  padding:20px 16px 50px;
  background:#f5f7fb;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",
  "Helvetica Neue",Arial,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
}

.header{
  text-align:center;
  padding:25px 10px 20px;
}

.header h1{
  margin:0;
  font-size:32px;
  font-weight:800;
}

.header p{
  margin:10px 0 0;
  color:#888;
  font-size:18px;
}

.card{
  background:white;
  border-radius:28px;
  padding:25px;
  margin-bottom:18px;
  box-shadow:0 5px 25px rgba(0,0,0,.05);
}

.weight-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

label{
  display:block;
  color:#666;
  font-size:17px;
  margin-bottom:9px;
}

input,textarea{
  width:100%;
  border:2px solid #e3e3e3;
  border-radius:18px;
  padding:16px;
  font-size:18px;
  outline:none;
  background:white;
}

input:focus,textarea:focus{
  border-color:#777;
}

textarea{
  min-height:120px;
  resize:none;
}

h2{
  margin:0 0 22px;
  font-size:26px;
}

.check-item{
  display:flex;
  align-items:center;
  gap:15px;
  padding:13px 0;
  font-size:21px;
  color:#666;
}

.check-item input{
  appearance:none;
  width:54px;
  height:54px;
  padding:0;
  flex:none;
  border:3px solid #aaa;
  border-radius:16px;
  background:white;
  position:relative;
}

.check-item input:checked{
  background:#3d8bfd;
  border-color:#3d8bfd;
}

.check-item input:checked::after{
  content:"✓";
  position:absolute;
  color:white;
  font-size:37px;
  font-weight:bold;
  left:9px;
  top:1px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  text-align:center;
}

.stat{
  color:#888;
  font-size:16px;
}

.stat strong{
  display:block;
  color:#222;
  font-size:24px;
  margin-top:4px;
}

.save{
  width:100%;
  border:0;
  border-radius:22px;
  padding:19px;
  background:#222;
  color:white;
  font-size:21px;
  font-weight:bold;
}

.save:active{
  transform:scale(.98);
}

.history{
  margin-top:10px;
}

.history-row{
  display:grid;
  grid-template-columns:1.1fr .7fr 1.8fr;
  gap:8px;
  padding:13px 0;
  border-bottom:1px solid #eee;
  font-size:15px;
}

.history-row:last-child{
  border-bottom:0;
}

.good{
  color:#3d8bfd;
  font-weight:bold;
}

.empty{
  color:#999;
  text-align:center;
  padding:20px 0;
}

.tip{
  text-align:center;
  color:#999;
  margin-top:14px;
  font-size:14px;
}

.danger{
  width:100%;
  margin-top:15px;
  padding:13px;
  border-radius:16px;
  border:1px solid #ddd;
  background:white;
  color:#888;
}

@media(max-width:500px){
  body{
    padding:12px 12px 40px;
  }

  .header h1{
    font-size:28px;
  }

  .card{
    padding:20px;
    border-radius:24px;
  }

  .weight-grid{
    gap:10px;
  }

  .check-item{
    font-size:19px;
  }

  .check-item input{
    width:50px;
    height:50px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🌷 崔崔的减肥打卡</h1>
    <p>每天一点点，坚持就是胜利</p>
  </div>

  <div class="card">
    <div class="weight-grid">

      <div>
        <label>今天体重（kg）</label>
        <input id="weight" type="number" step="0.1" placeholder="例如 60.5">
      </div>

      <div>
        <label>目标体重（kg）</label>
        <input id="target" type="number" step="0.1" placeholder="例如 55">
      </div>

    </div>
  </div>

  <div class="card">

    <h2>📋 今日打卡</h2>

    <label class="check-item">
      <input type="checkbox" id="water">
      <span>💧 喝够水</span>
    </label>

    <label class="check-item">
      <input type="checkbox" id="exercise">
      <span>🏃 完成运动</span>
    </label>

    <label class="check-item">
      <input type="checkbox" id="diet">
      <span>🥗 控制饮食</span>
    </label>

    <label class="check-item">
      <input type="checkbox" id="drink">
      <span>🥤 零奶茶 / 咖啡</span>
    </label>

  </div>

  <div class="card">

    <h2>📝 今日备注</h2>

    <textarea id="note"
      placeholder="记录今天的状态、心情、饮食情况……"></textarea>

  </div>

  <div class="card">

    <div class="stats">

      <div class="stat">
        连续打卡
        <strong id="streak">0天</strong>
      </div>

      <div class="stat">
        今日完成
        <strong id="progress">0/4</strong>
      </div>

      <div class="stat">
        体重变化
        <strong id="change">--</strong>
      </div>

    </div>

  </div>

  <button class="save" onclick="saveToday()">
    💾 保存今日打卡
  </button>

  <div class="tip">
    数据保存在你自己的手机浏览器中
  </div>

  <div class="card" style="margin-top:25px;">

    <h2>📅 历史打卡</h2>

    <div id="history" class="history"></div>

    <button class="danger" onclick="clearHistory()">
      清空历史记录
    </button>

  </div>

</div>

<script>

const STORAGE_KEY = "cuicui_diet_history";

function getHistory(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){
    return [];
  }
}

function saveHistory(data){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}

function todayString(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function getCheckedCount(){
  return [
    document.getElementById("water").checked,
    document.getElementById("exercise").checked,
    document.getElementById("diet").checked,
    document.getElementById("drink").checked
  ].filter(Boolean).length;
}

function updateProgress(){

  const count = getCheckedCount();

  document.getElementById("progress").textContent =
    count + "/4";

}

function updateChange(){

  const weight = parseFloat(
    document.getElementById("weight").value
  );

  const history = getHistory();

  if(isNaN(weight) || history.length === 0){
    document.getElementById("change").textContent="--";
    return;
  }

  const previous = [...history]
    .reverse()
    .find(x => x.weight && x.date !== todayString());

  if(!previous){
    document.getElementById("change").textContent="--";
    return;
  }

  const diff = weight - Number(previous.weight);

  if(diff > 0){
    document.getElementById("change").textContent =
      "+" + diff.toFixed(1);
  }else{
    document.getElementById("change").textContent =
      diff.toFixed(1);
  }
}

function calculateStreak(){

  const history = getHistory();

  if(history.length === 0){
    return 0;
  }

  const dates = new Set(history.map(x=>x.date));

  let streak = 0;

  const d = new Date();

  while(true){

    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");

    const key = `${y}-${m}-${day}`;

    if(!dates.has(key)){
      break;
    }

    streak++;

    d.setDate(d.getDate()-1);
  }

  return streak;
}

function updateStreak(){

  document.getElementById("streak").textContent =
    calculateStreak() + "天";

}

function renderHistory(){

  const history = getHistory();

  const box = document.getElementById("history");

  if(history.length === 0){

    box.innerHTML =
      '<div class="empty">还没有历史记录，今天开始吧 🌷</div>';

    return;
  }

  const sorted = [...history].sort(
    (a,b)=>b.date.localeCompare(a.date)
  );

  box.innerHTML = sorted.map(item => {

    const done = item.completed || 0;

    return `
      <div class="history-row">
        <div>${item.date}</div>

        <div>
          ${item.weight ? item.weight+" kg" : "--"}
        </div>

        <div class="${done === 4 ? "good" : ""}">
          ${done}/4
          ${item.note ? " · "+escapeHtml(item.note) : ""}
        </div>
      </div>
    `;

  }).join("");

}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function saveToday(){

  const date = todayString();

  const weightValue =
    document.getElementById("weight").value;

  const targetValue =
    document.getElementById("target").value;

  const record = {

    date:date,

    weight:weightValue
      ? Number(weightValue)
      : null,

    target:targetValue
      ? Number(targetValue)
      : null,

    water:document.getElementById("water").checked,

    exercise:document.getElementById("exercise").checked,

    diet:document.getElementById("diet").checked,

    drink:document.getElementById("drink").checked,

    completed:getCheckedCount(),

    note:document.getElementById("note").value.trim()

  };

  let history = getHistory();

  const index =
    history.findIndex(x=>x.date===date);

  if(index >= 0){
    history[index] = record;
  }else{
    history.push(record);
  }

  saveHistory(history);

  updateProgress();
  updateChange();
  updateStreak();
  renderHistory();

  alert("🌷 今天的打卡已经保存啦！");

}

function loadToday(){

  const date = todayString();

  const history = getHistory();

  const record =
    history.find(x=>x.date===date);

  if(!record){
    return;
  }

  if(record.weight !== null){
    document.getElementById("weight").value =
      record.weight;
  }

  if(record.target !== null){
    document.getElementById("target").value =
      record.target;
  }

  document.getElementById("water").checked =
    !!record.water;

  document.getElementById("exercise").checked =
    !!record.exercise;

  document.getElementById("diet").checked =
    !!record.diet;

  document.getElementById("drink").checked =
    !!record.drink;

  document.getElementById("note").value =
    record.note || "";

}

function clearHistory(){

  if(!confirm("确定要清空所有历史打卡吗？")){
    return;
  }

  localStorage.removeItem(STORAGE_KEY);

  document.getElementById("weight").value="";
  document.getElementById("target").value="";
  document.getElementById("note").value="";

  document.querySelectorAll(
    '.check-item input'
  ).forEach(x=>x.checked=false);

  updateProgress();
  updateChange();
  updateStreak();
  renderHistory();

}

document.querySelectorAll(
  '.check-item input'
).forEach(input=>{

  input.addEventListener(
    "change",
    updateProgress
  );

});

document.getElementById("weight")
  .addEventListener("input",updateChange);

loadToday();
updateProgress();
updateChange();
updateStreak();
renderHistory();

</script>

</body>
</html>
